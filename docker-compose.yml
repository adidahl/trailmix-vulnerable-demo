services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trailmix
      POSTGRES_PASSWORD: tm_demo_pw_1234
      POSTGRES_DB: trailmix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
  api:
    build: .
    env_file: ./api/.env
    depends_on:
      - db
    ports:
      - "4000:4000"
volumes:
  pgdata:
